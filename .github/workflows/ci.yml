name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - run: echo "Hello from $(hostname)"
      - run: pwd && ls -A
      - run: node --version
      - run: npm ci
      - run: npm run lint
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -d --build-arg GIT_SHA=${{ github.sha }} -t quotes:${{ github.sha }} .
      - name: Start
        run: docker run --name qoutes -p 3000:3000 quotes:${{ github.sha }}
      - name: Smoke test
        run: |
          curl --retry 5 --retry-delay 5 --retry-all-errors http://localhost:3000/health
          curl -fsS http://localhost:3000/version | grep ${{ github.sha }}
      - name: Container logs
        if: always()
        run: docker logs qoutes
